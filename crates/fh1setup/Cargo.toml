[package]
name = "fh1setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Converts the user's own Forza Horizon disc into assets for fh1-engine"

[dependencies]
fh1-world = { path = "../fh1-world" }
fh1-audio = { path = "../fh1-audio", default-features = false }
fh1-formats = { path = "../fh1-formats" }
fh1-radio = { path = "../fh1-radio", default-features = false }
fh1-ui = { path = "../fh1-ui" }
fh1-shaders = { path = "../fh1-shaders" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.42"
sha2 = "0.11"
anyhow = "1"
png = "0.18"
texpresso = { version = "2", features = ["rayon"] }
rayon = "1"
# Disc images handed over inside a .zip (zip64, deflate/deflate64/lzma as 7-Zip and Windows write them).
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma"] }

[dev-dependencies]
# `examples/fm2_ps_gpu` runs a translated FM2 pixel shader on the real GPU, so the WGSL translation can be checked
# against the CPU interpreter (`examples/fm2_ps_run`) pixel for pixel. Same wgpu as bevy uses (Cargo.lock: 29.0.4),
# so it runs on the vendored wgpu-core patch like the game does.
wgpu = "29"
# Same check, translation side: `--validate-all` parses every translated module with naga, which is what the GPU
# driver does, so a shader the translator gets wrong is found without a window.
naga = { version = "29", features = ["wgsl-in"] }
# The FM2 final-combine parameters (`post::Fm2Post::from_xml`), so the probe reads the track's tone curve through the
# same struct the renderer uses instead of parsing TrackSettings.xml a second time.
fh1-remaster = { path = "../fh1-remaster" }

[features]
# Importers for other Forza games the user owns: `fh1setup import-fh2` / `import-fm4` / `import-fm3`. Default features since 2026-10-08
# (user: every build carries them); `--no-default-features` builds the FH1-only tool.
default = ["fh2", "fm4", "fm3", "fm2", "fm1", "fm6"]
fh2 = []
fm4 = []
# FM3 circuits reuse the FM4 map builder.
fm3 = ["fm4"]
fm2 = ["fm4"]
# FM1 (original Xbox) cars: `fh1setup import-fm1 <extracted disc folder>`; shares the FM2 car glTF writer.
fm1 = []
# FM6 (Xbox One) cars: `fh1setup import-fm6 <FM6 Mount folder> [--cars A,B]`; uses the FM4 index step and the FM2 glTF writer.
fm6 = ["fm4", "fh2"]
